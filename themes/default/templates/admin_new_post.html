{{ template "header.html" .}}
<script src="/js/admin-script.js"></script>
<div class="container">
    {{ template "admin_nav.html" . }}
    <div class="admin-panel">

    <h1>Create post</h1>

    <div class="form-group">
        <label for="title">Title <span class="require">*</span></label>
        <input type="text" class="form-control" name="title" id="title"/>
    </div>

    <div class="form-group">
        <label for="post_type_id">Post Type</label>
        <select class="form-control" id="post_type_id">
            {{ range .post_types }}
            <option value="{{ .ID }}">{{ .Name }}</option>
            {{ end }}
        </select>
    </div>

    <div class="form-group">
        <label for="tags">Tags <small>(comma-separated)</small></label>
        <input type="text" class="form-control" name="tags" id="tags"/>
    </div>

    <div class="form-group">
        <label for="created_at">Date Created</label>
        <div class="input-group date" id="datetimepicker1" data-target-input="nearest">
            <input type="text" class="form-control datetimepicker-input" data-target="#datetimepicker1" id="created_at" name="created_at" value="{{ .post.CreatedAt.Format "01/02/2006 15:04:05 PM" }}"/>
            <div class="input-group-append" data-target="#datetimepicker1" data-toggle="datetimepicker">
                <div class="input-group-text"><i class="fa fa-calendar"></i></div>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label for="content">Content <span class="require">*</span></label>
        <ul class="nav nav-tabs editor-tabs" data-editor="content">
            <li class="nav-item"><a class="nav-link active" href="#" data-tab="write">Write</a></li>
            <li class="nav-item"><a class="nav-link" href="#" data-tab="preview">Preview</a></li>
        </ul>
        <div class="text-left" id="content-write">
            <textarea rows="5" class="form-control" name="content" id="content"></textarea>
        </div>
        <div class="editor-preview-pane" id="content-preview" style="display: none;"></div>
    </div>

    <div class="form-group">
        <p><span class="require">*</span> - required fields</p>
    </div>

    <div class="form-group">
        <button class="btn btn-primary" onclick="createPost(false);">
            Draft
        </button>
        <button class="btn btn-primary" onclick="createPost(true);">
            Publish
        </button>
        <button class="btn btn-default" onClick="window.location.reload();">
            Cancel
        </button>
    </div>

    </div> <!-- / admin-panel -->
    </div> <!-- / container -->

    <script>
        var simplemde = new SimpleMDE({
            element: $("#content")[0],
            // One preview mechanism: the Write/Preview tabs, which render
            // through the server. SimpleMDE's own preview uses a different
            // markdown implementation and would disagree.
            toolbar: ["bold", "italic", "heading", "|", "quote", "unordered-list", "ordered-list", "|", "link", "image", "|", "guide"],
            spellChecker: false
        });

        //https://github.com/sparksuite/simplemde-markdown-editor/issues/328
        inlineAttachment.editors.codemirror4.attach(simplemde.codemirror, {
            uploadUrl: "/api/v1/upload",
            onFileUploadResponse: function(xhr) {
                var result = JSON.parse(xhr.responseText);
                console.log(result);
                filename = result[this.settings.jsonFieldName];
                console.log(filename);
                console.log(this.filenameTag);
                if (result && filename) {
                    var newValue;
                    if (typeof this.settings.urlText === 'function') {
                        newValue = this.settings.urlText.call(this, filename, result);
                    } else {
                        newValue = this.settings.urlText.replace(this.filenameTag, filename);
                    }
                    var text = this.editor.getValue().replace(this.lastValue, newValue);
                    this.editor.setValue(text);
                    this.settings.onFileUploaded.call(this, filename);
                }
                return false;
            }
        });

        setupEditorTabs("content");

        $(function () {
            $('#datetimepicker1').datetimepicker({timezone: "UTC"});
        });
    </script>

{{ template "footer.html" .}}
