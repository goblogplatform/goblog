{{ template "header.html" .}}

<script type="text/javascript">
  // jQuery is deferred, so $ only exists once parsing is done. Every deferred
  // script has run by the time DOMContentLoaded fires, which also makes the
  // old $(function () { ... }) wrapper redundant.
  document.addEventListener("DOMContentLoaded", function () {
    // Where to go after logging in; validated server-side to a same-site path.
    var next = {{ .next }};
    var emailForm = $("#email-form"), codeForm = $("#code-form"),
        status = $("#email-login-status"), change = $("#email-change");
    if (!emailForm.length) { return; }
    function showError(xhr, fallback) {
      status.text((xhr.responseJSON && xhr.responseJSON.error) || fallback);
    }
    emailForm.on("submit", function (e) {
      e.preventDefault();
      status.text("");
      $.post("/api/login/email", {email: $("#email-input").val()})
        .done(function () {
          emailForm.hide(); codeForm.css("display", "flex"); change.show();
          status.text("Check your inbox for a 6-digit code.");
          $("#code-input").val("").focus();
        })
        .fail(function (xhr) { showError(xhr, "Could not send the code."); });
    });
    codeForm.on("submit", function (e) {
      e.preventDefault();
      status.text("");
      $.post("/api/login/email/verify", {email: $("#email-input").val(), code: $("#code-input").val()})
        .done(function () { window.location.href = next; })
        .fail(function (xhr) { showError(xhr, "Could not verify the code."); });
    });
    change.on("click", function (e) {
      e.preventDefault();
      codeForm.hide(); change.hide(); emailForm.show(); status.text("");
    });
  });
</script>

<div class="full-height row text-center">
  <div class="container align-self-center">
    <h4>Site Login</h4>
    <div class="clear">
      &nbsp;
    </div>

    <img src="{{ .settings.landing_page_image.Value }}" class="rounded-circle img-responsive" style="max-width:300px;" alt="{{ .settings.site_title.Value }}"/>

    <div class="clear">
      &nbsp;
    </div>

    <div class="container">
      <a id="github-button" class="btn btn-social btn-github" href="{{ .github_login_url }}">
        <i class="fab fa-github fa-1x"></i> Sign in with GitHub
      </a>

      {{ if .email_login_enabled }}
      <div class="clear">&nbsp;</div>
      <p class="text-muted">or sign in with email</p>
      <form id="email-form" class="justify-content-center gap-2 flex-wrap mx-auto" style="display: flex; max-width: 420px;">
        <input type="email" id="email-input" class="form-control flex-grow-1" style="flex-basis: 220px;" placeholder="you@example.com" autocomplete="email" required>
        <button type="submit" class="btn btn-primary">Send code</button>
      </form>
      <form id="code-form" class="justify-content-center gap-2 flex-wrap mx-auto" style="display: none; max-width: 420px;">
        <input type="text" id="code-input" class="form-control flex-grow-1" style="flex-basis: 220px; letter-spacing: 0.2em;" placeholder="6-digit code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
        <button type="submit" class="btn btn-primary">Verify</button>
      </form>
      <p id="email-login-status" class="text-muted mt-2" style="min-height: 1.5em;"></p>
      <a href="#" id="email-change" class="small" style="display: none;">use a different email</a>
      {{ end }}

      <div class="clear">
        &nbsp;
      </div>

    </div> <!-- /container (github button) -->
  </div> <!-- /container align-self-center -->
</div> <!-- /full-height row text-center -->

{{ template "footer.html" .}}
