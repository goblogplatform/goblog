name: Tagged Release

on:
  create:
    tags:
      - 'v*'

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.23.2
      uses: actions/setup-go@v6
      with:
        go-version: 1.26.1
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Get tag information
      id: checkout
      run: echo ::set-output name=tag::${GITHUB_REF#refs/*/}

    - name: Get dependencies
      run: |
        go get -v -t -d ./...
        if [ -f Gopkg.toml ]; then
            curl https://raw.githubusercontent.com/golang/dep/master/install.sh | sh
            dep ensure
        fi

    - name: Build
      run: go build -ldflags="-X 'main.Version=${{ steps.checkout.outputs.tag }}'" -v .

    - name: Test
      run: go test -race -coverprofile=coverage.txt -covermode=atomic goblog/...

    - name: Code Coverage
      uses: codecov/codecov-action@v5.5.2
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Dockerhub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # https://github.com/marketplace/actions/build-and-push-docker-images#Example-usage
    - name: Build and push tag
      id: docker_build
      uses: docker/build-push-action@v7
      with:
        push: true
        build-args: |
          VERSION=${{ steps.checkout.outputs.tag }}
        tags: |
          compscidr/goblog:${{ steps.checkout.outputs.tag }}
          compscidr/goblog:latest

    # iac pins this image tag in three places and Renovate only notices a new
    # tag when its shared queue gets round to the repo (often hours). A
    # dispatch is repo activity iac can act on immediately: its
    # goblog-release workflow opens the bump PR itself. IAC_TOKEN is a
    # fine-grained PAT with Contents: read & write on compscidr/iac (what
    # repository_dispatch requires).
    - name: Tell iac about the release
      env:
        GH_TOKEN: ${{ secrets.IAC_TOKEN }}
      run: |
        gh api repos/compscidr/iac/dispatches \
          -f event_type=goblog-released \
          -f 'client_payload[tag]=${{ steps.checkout.outputs.tag }}'
