name: Build and Test

on:
  push:
    branches:
      - "**"

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    services:
      # Lets the Postgres integration tests run (they skip when
      # GOBLOG_TEST_POSTGRES_DSN is unset, e.g. locally).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: goblog
          POSTGRES_PASSWORD: goblog
          POSTGRES_DB: goblog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goblog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:

      - name: Set up Go 1.22.2
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.1
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Get dependencies
        run: |
          go get -v -t -d ./...
          if [ -f Gopkg.toml ]; then
              curl https://raw.githubusercontent.com/golang/dep/master/install.sh | sh
              dep ensure
          fi

      - name: Build
        run: go build -ldflags="-X 'main.Version=$(git rev-parse HEAD)'" -v .

      - name: Test
        env:
          GOBLOG_TEST_POSTGRES_DSN: host=localhost port=5432 user=goblog password=goblog dbname=goblog sslmode=disable
        run: go test -race -coverprofile=coverage.txt -covermode=atomic goblog/...