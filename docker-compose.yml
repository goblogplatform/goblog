version: "3.0"
services:
  db:
    container_name: db
    image: mysql:9.6
    restart: always
    env_file:
      template.env
    ports:
      - "3306:3306"

  # Alternative to the mysql service above: set database=postgres and the
  # POSTGRES_* variables in template.env, then swap the goblog service's
  # depends_on to db-postgres.
  # db-postgres:
  #   container_name: db-postgres
  #   image: postgres:16-alpine
  #   restart: always
  #   environment:
  #     POSTGRES_DB: goblog
  #     POSTGRES_USER: goblog
  #     POSTGRES_PASSWORD: somedbpass
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - ./pgdata:/var/lib/postgresql/data

  phpmyadmin:
    depends_on:
      - db
    container_name: phpmyadmin
    image: phpmyadmin/phpmyadmin
    restart: always
    env_file:
      template.env
    ports:
      - '8080:80'

  goblog:
    build:
      context: .
      args:
        VERSION: develop
    image: compscidr/goblog:latest
    container_name: goblog
    depends_on:
      - db
    restart: always
    env_file:
      template.env
    ports:
      - "7000:7000"
    volumes:
      - ./template.env:/go/src/github.com/compscidr/goblog/local.env
      - ../:/var/www/html/
      - ${PWD}/test.db:/go/src/github.com/compscidr/goblog/test.db