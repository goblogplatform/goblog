{{ template "header.html" .}}

  <div class="container">

    {{ if .query }}
    <h1 class="text-left">Search results for '{{ .query }}'</h1>
    {{ else }}
    <h1 class="text-left">Search</h1>
    {{ end }}

    <form action="/search" method="GET" class="search-page-form">
      <label for="search-query" class="sr-only" style="position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden;">Search</label>
      <input type="text" id="search-query" name="q" value="{{ .query }}" placeholder="Search..." class="search-page-input" />
      <button type="submit" class="search-page-btn">Search</button>
    </form>

    {{ template "_search_results" . }}
  </div>

{{ template "footer.html" .}}
